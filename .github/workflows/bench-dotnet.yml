name: Dream vs .NET 10 Native AOT

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-dotnet-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  compare:
    name: Native micro and macro vs .NET 10 Native AOT
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev ninja-build pkg-config python3 xz-utils zlib1g-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-dotnet-release
      - uses: actions/setup-dotnet@v5
        id: dotnet
        with:
          dotnet-version: '10.0.x'
      - name: Select the installed .NET 10 SDK
        env:
          DOTNET_SDK_VERSION: ${{ steps.dotnet.outputs.dotnet-version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          Path("global.json").write_text(json.dumps({"sdk": {
              "version": os.environ["DOTNET_SDK_VERSION"], "rollForward": "disable"
          }}) + "\n")
          PY
      - uses: actions/cache@v6
        with:
          path: ~/.dream/toolchains/llvm-22.1.8
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM
        run: scripts/fetch-dev-llvm.sh
      - name: Build this revision's release compiler and host libraries
        id: build
        run: cargo build --locked --release -p dream -p dream-host
      - name: Build the base revision's release compiler
        id: baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision to compare against"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach target/bench-baseline "$BASE_SHA"
          (cd target/bench-baseline && CARGO_TARGET_DIR="$PWD/target" \
            cargo build --locked --release -p dream -p dream-host)
          echo "available=true" >> "$GITHUB_OUTPUT"
      # Paired Dream-only rounds on one runner: the C# comparison stays informational, but a
      # non-overlapping slowdown past the 10% budget against the base revision fails the job.
      - name: Gate micro and macro against the base revision
        if: ${{ !cancelled() && steps.baseline.outputs.available == 'true' }}
        shell: bash
        run: |
          failed=0
          for suite in micro macro; do
            output="target/bench-gate/$suite"
            mkdir -p "$output"
            python3 scripts/bench.py --target native --suite "$suite" \
              --arms baseline current --current-dream target/release/dream \
              --baseline-dream target/bench-baseline/target/release/dream \
              --warmup 2 --rounds 12 --passes 5 --fail-on-regression --out "$output" \
              2>&1 | tee "$output/comparison.txt" || failed=1
          done
          exit "$failed"
      - name: Compare micro Dream and .NET 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BENCH_SUITE: micro
        shell: bash
        run: |
          output="target/bench-dotnet/$BENCH_SUITE"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/revision.txt"
          dotnet --info > "$output/dotnet-info.txt"
          python3 scripts/bench.py --target native --suite "$BENCH_SUITE" \
            --arms current csharp --current-dream target/release/dream \
            --warmup 2 --rounds 20 --passes 10 --out "$output" \
            2>&1 | tee "$output/comparison.txt"
      - name: Compare macro Dream and .NET 10
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BENCH_SUITE: macro
        shell: bash
        run: |
          output="target/bench-dotnet/$BENCH_SUITE"
          mkdir -p "$output"
          git rev-parse HEAD > "$output/revision.txt"
          dotnet --info > "$output/dotnet-info.txt"
          python3 scripts/bench.py --target native --suite "$BENCH_SUITE" \
            --arms current csharp --current-dream target/release/dream \
            --warmup 2 --rounds 20 --passes 10 --out "$output" \
            2>&1 | tee "$output/comparison.txt"
      - name: Publish comparison in the job summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          for suite in ("micro", "macro"):
              output = Path("target/bench-dotnet") / suite
              report = output / "comparison.txt"
              if report.exists():
                  revision = (output / "revision.txt").read_text().strip()
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                      summary.write(f"## Dream vs .NET 10 Native AOT: {suite}\n\nRevision: `{revision}`\n\n")
                      summary.write("C# uses a speed-optimized Native AOT executable. "
                                    "Both arms were built and measured on this runner in this run. "
                                    "`cur/C#` below 1 means Dream took less time. "
                                    "Hosted measurements are informational; lifecycle/engine differences "
                                    "are recorded in summary.json.\n\n```text\n")
                      summary.write(report.read_text())
                      summary.write("\n```\n")
              gate = Path("target/bench-gate") / suite / "comparison.txt"
              if gate.exists():
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                      summary.write(f"## Dream regression gate vs base revision: {suite}\n\n"
                                    "`cur/base` above the 10% budget with a non-overlapping interval "
                                    "fails the job.\n\n```text\n")
                      summary.write(gate.read_text())
                      summary.write("\n```\n")
          PY
      - name: Preserve measurements and build identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dream-dotnet10-${{ github.sha }}
          path: |
            target/bench-dotnet/*/*.txt
            target/bench-dotnet/*/*.json*
            target/bench-dotnet/*/*/build.json
            target/bench-dotnet/*/csharp/publish.txt
            target/bench-gate/*/*.txt
            target/bench-gate/*/*.json*
          retention-days: 30
          if-no-files-found: warn
