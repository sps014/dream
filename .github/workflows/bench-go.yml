name: Go bench report

# Manual only. Compares tests/bench micro and macro against the Go ports in
# tests/bench/compare and publishes the table. It does not run on pull requests
# and a timing result does not fail the job. A checksum mismatch does.
on:
  workflow_dispatch:
    inputs:
      rounds:
        description: Measured passes per suite (1-10). Each process warms up once first.
        default: "3"
        required: true

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  report:
    name: Micro and macro vs Go
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev ninja-build pkg-config python3 xz-utils zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libfontconfig1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-release
      - uses: actions/setup-go@v7
        with:
          go-version: "1.27"
      - uses: actions/cache@v6
        with:
          path: |
            ~/.dream/toolchains/llvm-22.1.8
            ~/.dream/toolchains/mold-3.0.0-331ac66
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM
        run: scripts/fetch-dev-llvm.sh
      - name: Build the release compiler
        run: cargo build --locked --release -p dream
      - name: Run the Go comparison and publish the report
        run: python3 scripts/benchmarks/go_report.py --rounds "${{ inputs.rounds }}" --out target/go-report
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: go-bench-report-${{ github.sha }}
          path: |
            target/go-report/report.md
            target/go-report/report.json
          retention-days: 30
          if-no-files-found: warn
