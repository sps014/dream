name: Benchmark regression gate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bench-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

jobs:
  compare:
    name: Native micro and macro vs the base revision
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev ninja-build pkg-config python3 xz-utils zlib1g-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: bench-release
      # dream-host-gpu's build.rs downloads its pinned, hash-verified inputs once into this cache;
      # outside target/ so rust-cache's pruning cannot leave partial extractions behind.
      - name: Locate the GPU host cache
        run: echo "DREAM_GPU_CACHE=${{ runner.temp }}/dream-gpu-cache" >> "$GITHUB_ENV"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dream-gpu-cache
          key: gpu-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dream-host-gpu/pins.toml', 'crates/dream-host-gpu/patches/*') }}
      - uses: actions/cache@v6
        with:
          path: ~/.dream/toolchains/llvm-22.1.8
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM
        run: scripts/fetch-dev-llvm.sh
      - name: Build this revision's release compiler and host libraries
        id: build
        run: cargo build --locked --release -p dream -p dream-host
      - name: Build the base revision's release compiler
        id: baseline
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            echo "no base revision to compare against"
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          baseline_tree="$(mktemp -d "$RUNNER_TEMP/dream-bench-baseline.XXXXXX")/source"
          git worktree add --detach "$baseline_tree" "$BASE_SHA"
          (cd "$baseline_tree" && CARGO_TARGET_DIR="$PWD/target" \
            cargo build --locked --release -p dream -p dream-host)
          echo "dream=$baseline_tree/target/release/dream" >> "$GITHUB_OUTPUT"
          echo "runtime=$baseline_tree/crates/dream-mir/src/runtime/c" >> "$GITHUB_OUTPUT"
          echo "source=$baseline_tree" >> "$GITHUB_OUTPUT"
          echo "available=true" >> "$GITHUB_OUTPUT"
      # Paired rounds on one runner: a non-overlapping slowdown past the 10% budget against the
      # base revision fails the job.
      - name: Gate micro and macro against the base revision
        if: ${{ !cancelled() && steps.baseline.outputs.available == 'true' }}
        env:
          BASELINE_DREAM: ${{ steps.baseline.outputs.dream }}
          BASELINE_RUNTIME: ${{ steps.baseline.outputs.runtime }}
          BASELINE_SOURCE: ${{ steps.baseline.outputs.source }}
        shell: bash
        run: |
          failed=0
          for suite in micro macro; do
            fixture="tests/bench/microbenches.dream"
            if [ "$suite" = macro ]; then
              fixture="tests/bench/macro/macrobenches.dream"
            fi
            output="target/bench-gate/$suite"
            mkdir -p "$output"
            python3 scripts/bench.py --target native --suite "$suite" \
              --arms baseline current --current-dream target/release/dream \
              --baseline-dream "$BASELINE_DREAM" \
              --baseline-runtime "$BASELINE_RUNTIME" \
              --baseline-benchmark "$BASELINE_SOURCE/$fixture" \
              --warmup 2 --rounds 12 --passes 5 --function-alignment 64 --loop-alignment 32 \
              --diagnostics --fail-on-regression --out "$output" \
              2>&1 | tee "$output/comparison.txt" || failed=1
          done
          exit "$failed"
      - name: Publish comparison in the job summary
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          for suite in ("micro", "macro"):
              gate = Path("target/bench-gate") / suite / "comparison.txt"
              if gate.exists():
                  with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a") as summary:
                      summary.write(f"## Dream regression gate vs base revision: {suite}\n\n"
                                    "`cur/base` above the 10% budget with a non-overlapping interval "
                                    "fails the job.\n\n```text\n")
                      summary.write(gate.read_text())
                      summary.write("\n```\n")
          PY
      - name: Preserve measurements and build identities
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dream-bench-${{ github.sha }}
          path: |
            target/bench-gate/*/*.txt
            target/bench-gate/*/*.json*
            target/bench-gate/**/*.opt.ll
            target/bench-gate/**/*.remarks.yaml
          retention-days: 30
          if-no-files-found: warn
