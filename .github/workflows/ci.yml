name: CI

on:
  # pull_request:
  # merge_group:
  workflow_dispatch:
    inputs:
      compile_baseline:
        description: Git ref for the compile-time budget baseline
        default: origin/main
        type: string

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DREAM_VERIFY_MIR: "1"
  # Tests use O1; matching dev avoids rebuilding their dependency graph for codegen.
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_hygiene.py
      - run: python3 scripts/test_probe.py
      - run: python3 scripts/test_compile_budget.py

  build-clippy-test:
    name: Build, clippy, test (${{ matrix.os }})
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libgtk-3-dev libssl-dev \
            libudev-dev libwebkit2gtk-4.1-dev ninja-build pkg-config python3 xz-utils
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - name: Cache MSVC C and C++ compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "CC=sccache cl" >> $env:GITHUB_ENV
          "CXX=sccache cl" >> $env:GITHUB_ENV
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-o1-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      - uses: actions/cache/restore@v4
        id: llvm-cache
        with:
          path: ~/.dream/toolchains/llvm-22.1.8
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM and wasi-sdk support
        shell: bash
        run: scripts/fetch-dev-llvm.sh
      - name: Cache the validated pinned toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.dream/toolchains/llvm-22.1.8
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Freestanding runtime core (no SDK, CRT or libc)
        shell: bash
        run: |
          python scripts/check_freestanding.py --clang "$HOME/.dream/toolchains/llvm-22.1.8/bin/clang" --linker "$HOME/.dream/toolchains/llvm-22.1.8/bin/lld"
      - name: Use the MSVC-compatible pinned C driver
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "DREAM_CC=$env:USERPROFILE\.dream\toolchains\llvm-22.1.8\bin\clang.exe" >> $env:GITHUB_ENV
          "DREAM_CXX=$env:USERPROFILE\.dream\toolchains\llvm-22.1.8\bin\clang++.exe" >> $env:GITHUB_ENV
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace --timings
      - name: Check runnable documentation examples
        run: python tooling/docs/check_examples.py
      - run: cargo test --workspace --no-fail-fast --timings
      - name: Compile-time and memory regression budget
        if: runner.os == 'Linux'
        shell: bash
        env:
          COMPILE_BASELINE: ${{ inputs.compile_baseline || 'origin/main' }}
        run: |
          baseline_commit=$(git rev-parse --verify --end-of-options "${COMPILE_BASELINE}^{commit}")
          baseline_tree="$RUNNER_TEMP/dream-compile-baseline"
          cargo build --locked -p dream --bin dream
          cp target/debug/dream "$RUNNER_TEMP/dream-compile-candidate"
          git worktree add --detach "$baseline_tree" "$baseline_commit"
          cargo build --locked -p dream --bin dream --manifest-path "$baseline_tree/Cargo.toml" --target-dir "$PWD/target"
          cp target/debug/dream "$RUNNER_TEMP/dream-compile-baseline-bin"
          cp "$RUNNER_TEMP/dream-compile-candidate" target/debug/dream
          python3 scripts/check_compile_budget.py \
            --baseline "$RUNNER_TEMP/dream-compile-baseline-bin" \
            --candidate "$RUNNER_TEMP/dream-compile-candidate" \
            --baseline-revision "$baseline_commit" --candidate-revision "$GITHUB_SHA" \
            --report target/compile-budget.json
          git worktree remove --force "$baseline_tree"
      - name: Preserve compile budget measurements
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: compile-budget-Linux
          path: target/compile-budget.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Build release host capabilities
        run: cargo build --locked --release -p dream-host-core -p dream-host-unicode -p dream-host-crypto -p dream-host-process -p dream-host-timezone
      - name: Native distribution measurements and isolation
        run: python scripts/check-binary-size.py --compiler "target/debug/dream${{ runner.os == 'Windows' && '.exe' || '' }}" --host-directory target/release --llvm-directory "$HOME/.dream/toolchains/llvm-22.1.8/bin" --report target/binary-size.json
      - name: Preserve native size measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: binary-size-${{ runner.os }}-${{ runner.arch }}
          path: target/binary-size.json
          if-no-files-found: ignore
      - name: Preserve compilation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cargo-timings-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Full Windows native corpus
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/probe_test.py 2>&1 | Tee-Object -FilePath target/probe-native.log
          exit $LASTEXITCODE
      - name: Preserve Windows corpus results
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: corpus-Windows
          path: target/probe-native.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Weak lifetime race under ThreadSanitizer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stress_dir=$(mktemp -d)
          native=crates/dream-mir/src/runtime/c/sys/native
          core=crates/dream-mir/src/runtime/c/core
          clang -std=gnu11 -O1 -g -pthread -fsanitize=thread -I"$core/include" -I"$native/include" -I"$core/../include" \
            "$core/platform.c" "$core/utf8.c" "$native/platform.c" \
            "$core/heap.c" "$core/heap_maps.c" "$core/publish.c" \
            "$core/region.c" "$core/weak.c" "$native/sync.c" "$core/strings.c" tests/runtime_weak.c \
            -o "$stress_dir/weak"
          DREAM_DEBUG_LEAKS=1 "$stress_dir/weak"
      - name: Lock registry stress under ThreadSanitizer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stress_dir=$(mktemp -d)
          native=crates/dream-mir/src/runtime/c/sys/native
          core=crates/dream-mir/src/runtime/c/core
          clang -std=gnu11 -O1 -g -pthread -fsanitize=thread -I"$core/include" -I"$native/include" -I"$core/../include" \
            "$core/platform.c" "$core/utf8.c" "$native/platform.c" \
            "$core/heap.c" "$core/heap_maps.c" "$core/publish.c" \
            "$core/region.c" "$core/weak.c" "$core/strings.c" tests/runtime_sync.c \
            -o "$stress_dir/sync"
          DREAM_DEBUG_LEAKS=1 "$stress_dir/sync"

      - name: Worker registry stress under ThreadSanitizer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stress_dir=$(mktemp -d)
          native=crates/dream-mir/src/runtime/c/sys/native
          core=crates/dream-mir/src/runtime/c/core
          clang -std=gnu11 -O1 -g -pthread -fsanitize=thread -I"$core/include" -I"$native/include" -I"$core/../include" \
            "$core/platform.c" "$core/utf8.c" "$native/platform.c" \
            "$core/heap.c" "$core/heap_maps.c" "$core/publish.c" \
            "$core/region.c" "$core/weak.c" "$native/sync.c" "$core/strings.c" tests/runtime_worker.c \
            -o "$stress_dir/worker"
          DREAM_DEBUG_LEAKS=1 "$stress_dir/worker"

  golden-corpus:
    name: Full native corpus and WASM parity
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
    steps:
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libgtk-3-dev libssl-dev \
            libudev-dev libwebkit2gtk-4.1-dev mesa-vulkan-drivers ninja-build pkg-config python3 xz-utils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: mozilla-actions/sccache-action@v0.0.11
        with:
          version: "v0.16.0"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-o1-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
          # The workspace job saves the superset of build and test dependencies.
          save-if: false
      - uses: actions/cache/restore@v4
        id: llvm-cache
        with:
          path: ~/.dream/toolchains/llvm-22.1.8
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM and wasi-sdk support
        run: scripts/fetch-dev-llvm.sh
      - name: Cache the validated pinned toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.dream/toolchains/llvm-22.1.8
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - name: Full native corpus
        shell: bash
        run: |
          mkdir -p target
          ./scripts/probe_test.sh 2>&1 | tee target/probe-native.log
      - name: Full native/WASM stdout parity using the same build
        shell: bash
        run: python3 scripts/probe_test.py --parity 2>&1 | tee target/probe-parity.log
      - name: Preserve corpus results and compilation timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: corpus-Linux
          path: |
            target/probe-native.log
            target/probe-parity.log
            target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Preserve GPU corpus diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-corpus-diagnostics
          path: |
            tests/cases/target/debug/gpu_capabilities.opt.ll
            tests/cases/target/debug/gpu_capabilities.abi.json
            tests/cases/target/debug/gpu_pack_unorm.wgsl
