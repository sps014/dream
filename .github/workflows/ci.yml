name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DREAM_VERIFY_MIR: "1"

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_hygiene.py

  build-clippy-test:
    name: Build, clippy, test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libgtk-3-dev libssl-dev \
            libudev-dev libwebkit2gtk-4.1-dev ninja-build pkg-config python3 xz-utils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: ~/.dream/toolchains/llvm-22.1.8
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM and wasi-sdk support
        shell: bash
        run: scripts/fetch-dev-llvm.sh
      - run: cargo build --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  golden-corpus:
    name: Full native and Node corpus
    runs-on: ubuntu-latest
    env:
      WGPU_BACKEND: vulkan
    steps:
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev libgtk-3-dev libssl-dev \
            libudev-dev libwebkit2gtk-4.1-dev mesa-vulkan-drivers ninja-build pkg-config python3 xz-utils
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: actions/cache@v4
        with:
          path: ~/.dream/toolchains/llvm-22.1.8
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM and wasi-sdk support
        run: scripts/fetch-dev-llvm.sh
      - name: Probe GPU portability regressions
        run: ./scripts/probe_test.sh gpu_capabilities gpu_pack_unorm gpu_error_details gpu_sample_mask_out gpu_texture_atomic_bits
      - run: ./scripts/probe_test.sh
      - run: ./scripts/probe_test.sh --node
      - name: Preserve GPU corpus diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: gpu-corpus-diagnostics
          path: |
            tests/cases/target/debug/gpu_capabilities.opt.ll
            tests/cases/target/debug/gpu_capabilities.abi.json
            tests/cases/target/debug/gpu_pack_unorm.wgsl
