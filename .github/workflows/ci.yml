name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      compile_baseline:
        description: Git ref for the compile-time budget baseline
        default: origin/main
        type: string

# A later push waits. Cancelling the in-progress run kills the corpus with
# exit 143 before it can finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DREAM_VERIFY_MIR: "1"
  # Tests use O1; matching dev avoids rebuilding their dependency graph for codegen.
  CARGO_PROFILE_DEV_OPT_LEVEL: "1"
  CARGO_INCREMENTAL: "0"
  RUSTC_WRAPPER: sccache
  SCCACHE_GHA_ENABLED: "true"

permissions:
  contents: read

jobs:
  gpu-browser:
    name: Browser WebGPU execution and surfaces
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tooling/gpu-browser/package-lock.json
      - run: sudo apt-get update && sudo apt-get install -y mesa-vulkan-drivers vulkan-tools
      - run: npm ci
        working-directory: tooling/gpu-browser
      - run: npx playwright install --with-deps chromium
        working-directory: tooling/gpu-browser
      - run: |
          export VK_ICD_FILENAMES="$(printf '%s\n' /usr/share/vulkan/icd.d/*lvp*.json | head -1)"
          xvfb-run -a vulkaninfo --summary
          xvfb-run -a npm test
        working-directory: tooling/gpu-browser
        env:
          GPU_BROWSER_SOFTWARE: "1"
          GPU_BROWSER_HEADLESS: "0"
          DEBUG: pw:browser

  hygiene:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: python3 scripts/check_hygiene.py
      - run: python3 scripts/test_compile_budget.py
      - run: python3 scripts/test_bench_gate.py

  build-clippy-test:
    name: Build, clippy, test (${{ matrix.os }})
    # Windows was still passing corpus cases when the shared 60-minute limit expired.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev \
            ninja-build pkg-config python3 xz-utils \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libxtst-dev libfontconfig1-dev \
            libvulkan1 mesa-vulkan-drivers bubblewrap xvfb xauth
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs to
          # sandbox generator tools.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Locate the GPU host input cache
        shell: bash
        run: echo "DREAM_GPU_CACHE=${{ runner.temp }}/dream-gpu-cache" >> "$GITHUB_ENV"
      # dream-host-gpu's build.rs downloads its pinned, hash-verified inputs (slang-rhi, Dawn,
      # Slang headers) once into this cache.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dream-gpu-cache
          key: gpu-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dream-host-gpu/pins.toml', 'crates/dream-host-gpu/patches/*') }}
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/setup-python@v7
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install sccache
        shell: bash
        run: scripts/ci/install-sccache.sh
      - name: Cache MSVC C and C++ compilation
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Get-Command sccache -ErrorAction SilentlyContinue) {
            "CC=sccache cl" >> $env:GITHUB_ENV
            "CXX=sccache cl" >> $env:GITHUB_ENV
          }
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-o1-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
      - uses: actions/cache/restore@v6
        id: llvm-cache
        with:
          path: |
            ~/.dream/toolchains/llvm-22.1.8
            ~/.dream/toolchains/mold-3.0.0-331ac66
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM and wasi-sdk support
        shell: bash
        run: scripts/fetch-dev-llvm.sh
      - name: Cache the validated pinned toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.dream/toolchains/llvm-22.1.8
            ~/.dream/toolchains/mold-3.0.0-331ac66
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - uses: actions/cache@v6
        with:
          path: ~/.dream/toolchains/binaryen-133
          key: binaryen-133-${{ runner.os }}-${{ runner.arch }}
      # One full compilation. Clippy is a check: running it first leaves metadata-only
      # dependency artifacts, and the build then compiles that graph again. Tests and
      # clippy below reuse the rlibs this build writes.
      - run: cargo build --workspace --timings
      - run: cargo run --locked -p dreamer -- toolchain install binaryen
      # The GPU shader generator compiles with the pinned slangc and records layouts with
      # dream-slang-layout, which the install builds against that Slang release.
      - uses: actions/cache@v6
        with:
          path: ~/.dream/toolchains/slang-2026.20
          key: slang-2026.20-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dream-host-gpu/native/recorder/**', 'crates/dream-host-gpu/native/replay/layout_blob.*') }}
      - run: cargo run --locked -p dreamer -- toolchain install slang
      - name: Stage Windows SDK shader compilers inside the Slang sandbox
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $sdkBin = Join-Path $env:WindowsSdkVerBinPath x64
          $slangBin = Join-Path $env:USERPROFILE '.dream/toolchains/slang-2026.20/bin'
          foreach ($library in @('dxcompiler.dll', 'dxil.dll')) {
            Copy-Item -LiteralPath (Join-Path $sdkBin $library) -Destination $slangBin
          }
      # Linux and macOS skip the same targets (dxil, dxbc and ptx need dxc, fxc and NVRTC), so
      # their bundles must match the committed fixtures byte for byte.
      - name: Check GPU host test bundles are fresh
        if: runner.os != 'Windows'
        run: python3 crates/dream-host-gpu/tests/fixtures/make_bundles.py --check
      - name: Build GPU host bundles with Windows shader targets
        if: runner.os == 'Windows'
        run: python crates/dream-host-gpu/tests/fixtures/make_bundles.py
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - run: cargo test --workspace --no-fail-fast --timings
      # Dependencies are already built. This lints workspace crates only.
      - run: cargo clippy --workspace --all-targets --no-deps -- -D warnings
      - name: X11 windows and GPU presentation under a real display server
        if: runner.os == 'Linux'
        run: |
          xvfb-run -a env DREAM_WINDOW_DISPLAY_TEST=1 cargo test -p dream-host-window --test main_thread
          xvfb-run -a env DREAM_GPU_SURFACE_TEST=1 cargo test -p dream-host-gpu --test backends
      - name: Check capability artifacts and native CLI
        run: |
          python scripts/generate-capabilities.py --check
          python scripts/build-gpu-parser.py --check
          node --test scripts/test-wasm-size.mjs
      # Linux runs this case inside the full release corpus. macOS and Windows have no other
      # native CLI run.
      - name: Native CLI release smoke
        if: runner.os != 'Linux'
        run: python scripts/test_corpus.py --release cli_arguments
      - name: Compile-time and memory regression budget
        if: runner.os == 'Linux'
        shell: bash
        env:
          COMPILE_BASELINE: ${{ inputs.compile_baseline || 'origin/main' }}
        run: |
          baseline_commit=$(git rev-parse --verify --end-of-options "${COMPILE_BASELINE}^{commit}")
          baseline_tree="$RUNNER_TEMP/dream-compile-baseline"
          cargo build --locked -p dream --bin dream
          cp target/debug/dream "$RUNNER_TEMP/dream-compile-candidate"
          if [ "$baseline_commit" = "$(git rev-parse HEAD)" ]; then
            cp "$RUNNER_TEMP/dream-compile-candidate" "$RUNNER_TEMP/dream-compile-baseline-bin"
          else
            git worktree add --detach "$baseline_tree" "$baseline_commit"
            # A separate target directory, so this build does not replace the candidate's artifacts.
            cargo build --locked -p dream --bin dream --manifest-path "$baseline_tree/Cargo.toml" --target-dir "$baseline_tree/target"
            cp "$baseline_tree/target/debug/dream" "$RUNNER_TEMP/dream-compile-baseline-bin"
          fi
          # The baseline compiler reads its C runtime sources from the worktree it was built in,
          # so the worktree must outlive the measurement.
          status=0
          python3 scripts/check_compile_budget.py \
            --baseline "$RUNNER_TEMP/dream-compile-baseline-bin" \
            --candidate "$RUNNER_TEMP/dream-compile-candidate" \
            --baseline-revision "$baseline_commit" --candidate-revision "$GITHUB_SHA" \
            --report target/compile-budget.json || status=$?
          if [ -d "$baseline_tree" ]; then
            git worktree remove --force "$baseline_tree"
          fi
          exit "$status"
      - name: Preserve compile budget measurements
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: compile-budget-Linux
          path: target/compile-budget.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Build release host capabilities
        run: cargo build --locked --release -p dream-host-core -p dream-host-crypto -p dream-host-process -p dream-host-timezone -p dream-host-net -p dream-host-io -p dream-host-window -p dream-host-gpu
      - name: Native distribution measurements and isolation
        run: python scripts/check-binary-size.py --compiler "target/debug/dream${{ runner.os == 'Windows' && '.exe' || '' }}" --host-directory target/release --llvm-directory "$HOME/.dream/toolchains/llvm-22.1.8/bin" ${{ runner.os != 'Windows' && '--mold-directory "$HOME/.dream/toolchains/mold-3.0.0-331ac66"' || '' }} --report target/binary-size.json
      - name: Preserve native size measurements
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: binary-size-${{ runner.os }}-${{ runner.arch }}
          path: target/binary-size.json
          if-no-files-found: ignore
      - name: Preserve compilation timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cargo-timings-${{ runner.os }}-${{ runner.arch }}
          path: target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore
      - name: Full Windows native corpus
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/test_corpus.py 2>&1 | Tee-Object -FilePath target/probe-native.log
          exit $LASTEXITCODE
      # The core suite includes the drawing canvas, and the Node run compiles that
      # project only when the browser host exists beside the runtime.
      - name: Build drawing WASM host for Node assertions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python scripts/build-drawing-web.py
      - name: Windows Node corpus
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/test_corpus.py --node 2>&1 | Tee-Object -FilePath target/probe-node.log
          exit $LASTEXITCODE
      - name: macOS interop corpus
        if: runner.os == 'macOS'
        run: python3 scripts/test_corpus.py interop
      - name: Preserve Windows corpus results
        if: always() && runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: corpus-Windows
          path: target/probe-native.log
          retention-days: 7
          if-no-files-found: ignore
      - name: Weak lifetime race under ThreadSanitizer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stress_dir=$(mktemp -d)
          native=crates/dream-mir/src/runtime/c/sys/native
          core=crates/dream-mir/src/runtime/c/core
          clang -std=gnu11 -O1 -g -pthread -fsanitize=thread -DDREAM_HEAP_COUNTERS=1 -I"$core/include" -I"$native/include" -I"$core/../include" \
            "$core/platform.c" "$core/utf8.c" "$native/platform.c" "$native/stdout_buffer.c" \
            "$core/heap.c" "$core/ownership.c" "$core/heap_maps.c" "$core/heap_slabs.c" "$core/heap_large.c" "$core/publish.c" \
            "$core/region.c" "$core/weak.c" "$native/sync.c" "$core/strings.c" tests/runtime_weak.c \
            -o "$stress_dir/weak"
          "$stress_dir/weak"
      - name: Lock registry stress under ThreadSanitizer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stress_dir=$(mktemp -d)
          native=crates/dream-mir/src/runtime/c/sys/native
          core=crates/dream-mir/src/runtime/c/core
          clang -std=gnu11 -O1 -g -pthread -fsanitize=thread -DDREAM_HEAP_COUNTERS=1 -I"$core/include" -I"$native/include" -I"$core/../include" \
            "$core/platform.c" "$core/utf8.c" "$native/platform.c" "$native/stdout_buffer.c" \
            "$core/heap.c" "$core/ownership.c" "$core/heap_maps.c" "$core/heap_slabs.c" "$core/heap_large.c" "$core/publish.c" \
            "$core/region.c" "$core/weak.c" "$core/strings.c" tests/runtime_sync.c \
            -o "$stress_dir/sync"
          "$stress_dir/sync"

      - name: Worker registry stress under ThreadSanitizer
        if: runner.os == 'macOS'
        shell: bash
        run: |
          stress_dir=$(mktemp -d)
          native=crates/dream-mir/src/runtime/c/sys/native
          core=crates/dream-mir/src/runtime/c/core
          clang -std=gnu11 -O1 -g -pthread -fsanitize=thread -DDREAM_HEAP_COUNTERS=1 -I"$core/include" -I"$native/include" -I"$core/../include" \
            "$core/platform.c" "$core/utf8.c" "$native/platform.c" "$native/stdout_buffer.c" \
            "$core/heap.c" "$core/ownership.c" "$core/heap_maps.c" "$core/heap_slabs.c" "$core/heap_large.c" "$core/publish.c" \
            "$core/region.c" "$core/weak.c" "$native/sync.c" "$core/strings.c" tests/runtime_worker.c \
            -o "$stress_dir/worker"
          "$stress_dir/worker"

  golden-corpus:
    name: Full native corpus and WASM parity
    runs-on: ubuntu-24.04
    steps:
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev \
            ninja-build pkg-config python3 xz-utils \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libxtst-dev libfontconfig1-dev \
            libvulkan1 mesa-vulkan-drivers bubblewrap xvfb xauth
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs to
          # sandbox generator tools.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
      - name: Locate the GPU host input cache
        shell: bash
        run: echo "DREAM_GPU_CACHE=${{ runner.temp }}/dream-gpu-cache" >> "$GITHUB_ENV"
      # dream-host-gpu's build.rs downloads its pinned, hash-verified inputs (slang-rhi, Dawn,
      # Slang headers) once into this cache.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dream-gpu-cache
          key: gpu-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dream-host-gpu/pins.toml', 'crates/dream-host-gpu/patches/*') }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install sccache
        shell: bash
        run: scripts/ci/install-sccache.sh
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: JavaScript runtime storage and generated bundle
        run: |
          node scripts/bundle-runtime.mjs --check
          node --test scripts/test-pointer-integers.mjs scripts/test-bundle-runtime.mjs scripts/test-window-host.mjs scripts/test-typed-host.mjs scripts/test-socket-spans.mjs scripts/test-gpu-host.mjs scripts/test-stdlib-hosts.mjs scripts/test-cancellation-host.mjs scripts/test-http-host.mjs
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-o1-${{ runner.os }}-${{ runner.arch }}
          cache-on-failure: true
          # The workspace job saves the superset of build and test dependencies.
          save-if: false
      - uses: actions/cache/restore@v6
        id: llvm-cache
        with:
          path: |
            ~/.dream/toolchains/llvm-22.1.8
            ~/.dream/toolchains/mold-3.0.0-331ac66
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM and wasi-sdk support
        run: scripts/fetch-dev-llvm.sh
      - name: Cache the validated pinned toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.dream/toolchains/llvm-22.1.8
            ~/.dream/toolchains/mold-3.0.0-331ac66
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      # The GPU shader generator compiles with the pinned slangc and records layouts with
      # dream-slang-layout, which the install builds against that Slang release.
      - uses: actions/cache@v6
        with:
          path: ~/.dream/toolchains/slang-2026.20
          key: slang-2026.20-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dream-host-gpu/native/recorder/**', 'crates/dream-host-gpu/native/replay/layout_blob.*') }}
      - run: cargo run --locked -p dreamer -- toolchain install slang
      - name: Build drawing WASM host for Node assertions
        run: |
          rustup target add wasm32-unknown-unknown
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
          python3 scripts/build-drawing-web.py
      - name: Drawing canvas CPU and WebGPU browser presentation
        shell: bash
        env:
          GPU_BROWSER_SOFTWARE: "1"
          GPU_BROWSER_HEADLESS: "0"
        run: |
          cargo build --locked -p dream --bin dream
          npm ci --prefix tooling/gpu-browser
          (cd tooling/gpu-browser && npx playwright install --with-deps chromium)
          export VK_ICD_FILENAMES="$(printf '%s\n' /usr/share/vulkan/icd.d/*lvp*.json | head -1)"
          xvfb-run -a npm run test:drawing --prefix tooling/gpu-browser 2>&1 | tee target/drawing-browser.log
      - name: Preserve drawing browser diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drawing-browser-Linux
          path: |
            target/drawing-browser.log
            target/drawing-browser/presentation.png
            target/drawing-browser/presentation.json
          if-no-files-found: ignore
          retention-days: 7
      - name: Full native and Node assertion corpus
        id: corpus-debug
        shell: bash
        run: |
          mkdir -p target
          python3 scripts/test_corpus.py --both 2>&1 | tee target/corpus.log
      # Debug guest builds skip inlining, the release function pipeline and every late module
      # pass; only release builds exercise the ARC elision that ships.
      - name: Full native and Node assertion corpus (release guest builds)
        if: ${{ !cancelled() && (steps.corpus-debug.outcome == 'success' || steps.corpus-debug.outcome == 'failure') }}
        shell: bash
        run: |
          mkdir -p target
          python3 scripts/test_corpus.py --both --release 2>&1 | tee target/corpus-release.log
      - name: Preserve corpus results and compilation timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: corpus-Linux
          path: |
            target/corpus.log
            target/corpus-release.log
            target/cargo-timings/*.html
          retention-days: 7
          if-no-files-found: ignore

  corpus-sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.timeout }}
    env:
      DREAM_NATIVE_SANITIZE: ${{ matrix.sanitizer }}
      ASAN_OPTIONS: detect_leaks=0:halt_on_error=1:abort_on_error=0
      TSAN_OPTIONS: halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
      RUSTC_WRAPPER: ''
    strategy:
      fail-fast: false
      matrix:
        # Setup consumed 23 minutes before the debug corpus; the combined job then
        # expired during release compilation. Each profile needs its own budget.
        include:
          - name: Golden corpus under address,undefined sanitizer
            sanitizer: address,undefined
            profile: debug
            timeout: 60
          - name: Optimized corpus under address,undefined sanitizer
            sanitizer: address,undefined
            profile: release
            timeout: 180
          - name: Golden corpus under thread sanitizer
            sanitizer: thread
            profile: concurrency
            timeout: 60
    steps:
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang cmake libclang-dev \
            ninja-build pkg-config python3 xz-utils \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev libxss-dev libxtst-dev libfontconfig1-dev \
            libvulkan1 mesa-vulkan-drivers bubblewrap
          # Ubuntu 24.04 blocks unprivileged user namespaces, which bubblewrap needs to
          # sandbox generator tools.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - uses: actions/checkout@v7
      - name: Locate the GPU host input cache
        shell: bash
        run: echo "DREAM_GPU_CACHE=${{ runner.temp }}/dream-gpu-cache" >> "$GITHUB_ENV"
      # dream-host-gpu's build.rs downloads its pinned, hash-verified inputs (slang-rhi, Dawn,
      # Slang headers) once into this cache.
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/dream-gpu-cache
          key: gpu-host-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dream-host-gpu/pins.toml', 'crates/dream-host-gpu/patches/*') }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci-o1-${{ runner.os }}-${{ runner.arch }}
          save-if: false
      - uses: actions/cache/restore@v6
        with:
          path: |
            ~/.dream/toolchains/llvm-22.1.8
            ~/.dream/toolchains/mold-3.0.0-331ac66
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM and wasi-sdk support
        run: scripts/fetch-dev-llvm.sh
      # The GPU shader generator compiles with the pinned slangc and records layouts with
      # dream-slang-layout, which the install builds against that Slang release.
      - uses: actions/cache@v6
        with:
          path: ~/.dream/toolchains/slang-2026.20
          key: slang-2026.20-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crates/dream-host-gpu/native/recorder/**', 'crates/dream-host-gpu/native/replay/layout_blob.*') }}
      - run: cargo run --locked -p dreamer -- toolchain install slang
      # The runtime's own allocator hides heap blocks from ASan's malloc interposition; the
      # runtime poisons freed payloads instead, so dangling reads through ARC bugs still trap.
      - name: Full native corpus (runtime instrumented)
        if: matrix.profile == 'debug'
        shell: bash
        run: |
          mkdir -p target
          python3 scripts/test_corpus.py 2>&1 | tee target/probe-sanitize.log
      - name: Full native corpus, release guest builds (runtime instrumented)
        if: matrix.profile == 'release'
        shell: bash
        run: |
          mkdir -p target
          python3 scripts/test_corpus.py --release 2>&1 | tee target/probe-sanitize-release.log
      - name: Concurrency cases (runtime instrumented)
        if: matrix.profile == 'concurrency'
        shell: bash
        run: |
          mkdir -p target
          python3 scripts/test_corpus.py --concurrency 2>&1 | tee target/probe-sanitize.log
      - name: Runtime fuzz harnesses (60 s each)
        if: matrix.profile == 'debug'
        shell: bash
        run: scripts/fuzz_runtime.sh 60
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: corpus-sanitize-${{ matrix.profile }}
          path: target/probe-sanitize*.log
          retention-days: 7
          if-no-files-found: ignore

  worker-sanitizers:
    name: Worker sanitizer (${{ matrix.sanitizer }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CC: clang
      DREAM_WORKER_SANITIZER: ${{ matrix.sanitizer }}
      TSAN_OPTIONS: halt_on_error=1
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: halt_on_error=1
      RUSTC_WRAPPER: ''
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, 'address,undefined']
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache/restore@v6
        id: llvm-cache
        with:
          path: |
            ~/.dream/toolchains/llvm-22.1.8
            ~/.dream/toolchains/mold-3.0.0-331ac66
          key: dev-llvm-22.1.8-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/fetch-dev-llvm.sh') }}
      - name: Install pinned LLVM
        shell: bash
        run: scripts/fetch-dev-llvm.sh
      - name: Cache the validated pinned toolchain
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            ~/.dream/toolchains/llvm-22.1.8
            ~/.dream/toolchains/mold-3.0.0-331ac66
          key: ${{ steps.llvm-cache.outputs.cache-primary-key }}
      - run: "cargo test --test integration -- runtime_worker:: runtime_ownership:: runtime_weak:: runtime_callback:: runtime_cancellation:: --nocapture"

  supply-chain:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The action runs in a container that does not have the workflow's sccache wrapper.
    env:
      RUSTC_WRAPPER: ''
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
