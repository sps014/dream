name: LLVM dist

# Builds the minimal LLVM bundled into Dream releases (scripts/build-llvm-dist.sh) once per LLVM
# version and publishes it under the `llvm-dist-<version>` release, which release.yml downloads.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/build-llvm-dist.sh
      - .github/workflows/llvm-dist.yml

permissions:
  contents: write

env:
  # Must match `LLVM_VERSION` in crates/dream-abi/src/toolchain.rs.
  LLVM_VERSION: "22.1.8"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: linux-x64
            arch: x86_64
          - os: ubuntu-24.04-arm
            target: linux-arm64
            arch: aarch64
          - os: macos-latest
            target: macos-x64
            arch: x86_64
          - os: macos-latest
            target: macos-arm64
            arch: arm64
          - os: windows-latest
            target: windows-x64
            arch: x86_64

    runs-on: ${{ matrix.os }}
    # Same glibc floor as the release binaries.
    container: ${{ contains(matrix.target, 'linux') && 'debian:bookworm' || fromJSON('null') }}
    steps:
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git xz-utils \
            build-essential cmake ninja-build python3

      - name: Install macOS build deps
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install Windows build deps
        if: runner.os == 'Windows'
        run: choco install ninja -y

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - uses: actions/checkout@v7

      - name: Check pinned version
        shell: bash
        run: |
          grep -q "LLVM_VERSION: &str = \"${LLVM_VERSION}\"" crates/dream-abi/src/toolchain.rs

      - uses: actions/cache@v6
        id: cache
        with:
          path: dist
          key: llvm-dist-${{ env.LLVM_VERSION }}-${{ matrix.target }}-${{ hashFiles('scripts/build-llvm-dist.sh', '.github/workflows/llvm-dist.yml') }}

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -o src.tar.xz \
            "https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/llvm-project-${LLVM_VERSION}.src.tar.xz"
          # Only what the clang/lld, tests-off build reads; the skipped trees hold symlinks that
          # Git Bash's tar cannot create on Windows.
          S="llvm-project-${LLVM_VERSION}.src"
          tar -xJf src.tar.xz \
            --exclude='*/test' --exclude='*/unittests' --exclude="$S/llvm/utils/mlgo-utils/*.py" \
            "$S/llvm" "$S/clang" "$S/lld" "$S/cmake" "$S/third-party" "$S/libunwind"
          NAME="dream-llvm-${LLVM_VERSION}-${{ matrix.target }}"
          LLVM_DIST_ARCH="${{ matrix.arch }}" BUILD_DIR="$PWD/build" \
            ./scripts/build-llvm-dist.sh "$PWD/llvm-project-${LLVM_VERSION}.src" "$PWD/stage/$NAME"
          mkdir -p dist
          tar -C stage -cJf "dist/$NAME.tar.xz" "$NAME"

      # Every library a tool loads must be in the archive: run the unpacked tools away from the
      # build tree. The macOS x64 bundle is cross-built and cannot run on the arm64 runner.
      - name: Run the packaged tools
        if: matrix.target != 'macos-x64'
        shell: bash
        run: |
          set -euo pipefail
          CHECK="$(mktemp -d)"
          tar -xJf dist/*.tar.xz -C "$CHECK" --strip-components=1
          EXE=""
          if [[ "${{ runner.os }}" == Windows ]]; then EXE=".exe"; fi
          printf 'int add(int a, int b) { return a + b; }\n' > "$CHECK/check.c"
          "$CHECK/bin/clang$EXE" -c -O2 "$CHECK/check.c" -o "$CHECK/check.o"
          "$CHECK/bin/clang$EXE" -c -emit-llvm -O2 "$CHECK/check.c" -o "$CHECK/check.bc"
          for tool in opt llc llvm-link llvm-dis llvm-ar llvm-profdata; do
            "$CHECK/bin/$tool$EXE" --version > /dev/null
          done
          "$CHECK/bin/opt$EXE" -O2 "$CHECK/check.bc" -o /dev/null
          "$CHECK/bin/llc$EXE" -filetype=obj "$CHECK/check.bc" -o "$CHECK/check2.o"

      - uses: actions/upload-artifact@v4
        with:
          name: llvm-dist-${{ matrix.target }}
          path: dist/*.tar.xz

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Checksums
        run: |
          mkdir -p release
          find artifacts -name '*.tar.xz' -exec cp {} release/ \;
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: llvm-dist-${{ env.LLVM_VERSION }}
          name: Dream LLVM ${{ env.LLVM_VERSION }} (bundled toolchain)
          body: Minimal LLVM bundled into Dream releases; built by scripts/build-llvm-dist.sh.
          prerelease: true
          files: release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
