name: Publish packages

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Build dreamer
        run: cargo build -p dreamer --release

      - name: Publish workspace packages
        working-directory: packages
        env:
          DREAM_REGISTRY_TOKEN: ${{ secrets.DREAM_REGISTRY_TOKEN }}
        run: |
          if [ -z "$DREAM_REGISTRY_TOKEN" ]; then
            echo "Set the DREAM_REGISTRY_TOKEN secret to a token that can write the dream-registry repository."
            exit 1
          fi
          "$GITHUB_WORKSPACE/target/release/dreamer" publish
