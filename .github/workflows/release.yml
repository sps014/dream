name: Release toolchain

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); leave empty to use github.ref_name"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 12 keeps the Linux distribution compatible with glibc 2.36.
          - os: ubuntu-latest
            container: debian:bookworm
            target: linux-x64
            rust_target: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            container: debian:bookworm
            target: linux-arm64
            rust_target: ""
            archive: tar.gz
          # Intel macOS: cross-compile from Apple Silicon. macos-13 runners often sit
          # queued indefinitely on free/public repos.
          - os: macos-latest
            target: macos-x64
            rust_target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            rust_target: ""
            archive: tar.gz
          - os: windows-latest
            target: windows-x64
            rust_target: ""
            archive: zip

    runs-on: ${{ matrix.os }}
    container: ${{ contains(matrix.target, 'linux') && 'debian:bookworm' || fromJSON('null') }}
    steps:
      - name: Install Linux native build deps
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git xz-utils build-essential pkg-config \
            cmake ninja-build python3 clang libclang-dev \
            libx11-dev libxcursor-dev libxi-dev libxinerama-dev libxrandr-dev

      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'

      - name: Pin the Windows linker before entering Git Bash
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $linker = Join-Path $env:VCToolsInstallDir 'bin/Hostx64/x64/link.exe'
          if (!(Test-Path -LiteralPath $linker)) { throw "MSVC linker missing: $linker" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$linker" >> $env:GITHUB_ENV

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          # macOS /bin/bash is 3.2: `"${arr[@]}"` with `set -u` and an empty array is an error.
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            cargo build --release -p dream -p dream-host -p dream-host-core -p dream-host-crypto -p dream-host-process -p dream-host-timezone -p dream-host-net -p dream-host-io -p dream-host-gpu -p dream-host-window -p dreamer -p dream-lsp --target "${{ matrix.rust_target }}"
          else
            cargo build --release -p dream -p dream-host -p dream-host-core -p dream-host-crypto -p dream-host-process -p dream-host-timezone -p dream-host-net -p dream-host-io -p dream-host-gpu -p dream-host-window -p dreamer -p dream-lsp
          fi

      # The official LLVM (clang) builds the runtime the archive ships prebuilt; it is not shipped.
      - name: Fetch development LLVM
        shell: bash
        run: scripts/fetch-dev-llvm.sh

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          STAGE="dist/dream-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          EXT=""
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            EXT=".exe"
          fi
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            BIN_DIR="target/${{ matrix.rust_target }}/release"
          else
            BIN_DIR="target/release"
          fi
          cp "${BIN_DIR}/dream${EXT}" "$STAGE/"
          cp "${BIN_DIR}/dreamer${EXT}" "$STAGE/"
          cp "${BIN_DIR}/dream-lsp${EXT}" "$STAGE/"
          for capability in core crypto process timezone net cli data io gpu window; do
            case "$RUNNER_OS" in
              Windows) library="dream_host_${capability}.dll" ;;
              macOS) library="libdream_host_${capability}.dylib" ;;
              *) library="libdream_host_${capability}.so" ;;
            esac
            test -f "${BIN_DIR}/$library" || {
              echo "error: $library missing under ${BIN_DIR}" >&2
              exit 1
            }
            cp "${BIN_DIR}/$library" "$STAGE/"
            if [[ "$RUNNER_OS" == Windows ]]; then
              cp "${BIN_DIR}/$library.lib" "$STAGE/"
            fi
          done
          # The GPU host loads Dawn (native WebGPU) from its own directory.
          case "$RUNNER_OS" in
            Windows) cp "${BIN_DIR}/dawn.dll" "$STAGE/" ;;
            macOS) cp "${BIN_DIR}/libdawn.dylib" "$STAGE/" ;;
            *) cp "${BIN_DIR}/libdawn.so" "$STAGE/" ;;
          esac
          mkdir -p "$STAGE/lib/runtime"
          cp -R crates/dream-mir/src/runtime/c "$STAGE/lib/runtime/"
          # lib/dream: the minimal LLVM from the llvm-dist release (.github/workflows/llvm-dist.yml)
          # and the runtime prebuilt for every level, which `dream` finds beside itself.
          LLVM_VERSION="$(sed -n 's/^pub const LLVM_VERSION: &str = "\(.*\)";/\1/p' crates/dream-abi/src/toolchain.rs)"
          LLVM_DIST="dream-llvm-${LLVM_VERSION}-${{ matrix.target }}"
          curl -fL --retry 3 -o "${LLVM_DIST}.tar.xz" \
            "https://github.com/${{ github.repository }}/releases/download/llvm-dist-${LLVM_VERSION}/${LLVM_DIST}.tar.xz"
          mkdir -p "$STAGE/lib/dream/llvm"
          tar -xJf "${LLVM_DIST}.tar.xz" -C "$STAGE/lib/dream/llvm" --strip-components=1
          DREAM_LLVM="${HOME}/.dream/toolchains/llvm-${LLVM_VERSION}/bin" \
            "${BIN_DIR}/dream${EXT}" pack-runtime "$STAGE/lib/dream/rt"
          du -sh "$STAGE" "$STAGE/lib/dream/llvm" "$STAGE/lib/dream/rt"
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            # Windows runners have no `zip`; use PowerShell Compress-Archive.
            if command -v powershell.exe >/dev/null 2>&1; then
              powershell.exe -NoProfile -Command \
                "Compress-Archive -Path 'dist/dream-${VERSION}-${{ matrix.target }}' -DestinationPath 'dist/dream-${VERSION}-${{ matrix.target }}.zip' -Force"
            elif command -v pwsh >/dev/null 2>&1; then
              pwsh -NoProfile -Command \
                "Compress-Archive -Path 'dist/dream-${VERSION}-${{ matrix.target }}' -DestinationPath 'dist/dream-${VERSION}-${{ matrix.target }}.zip' -Force"
            else
              tar -C dist -a -cf "dist/dream-${VERSION}-${{ matrix.target }}.zip" "dream-${VERSION}-${{ matrix.target }}"
            fi
          else
            tar -C dist -czf "dist/dream-${VERSION}-${{ matrix.target }}.tar.gz" "dream-${VERSION}-${{ matrix.target }}"
          fi

      # The staged archive alone must build native and wasm32 programs: no DREAM_LLVM, and the
      # development LLVM moved out of reach.
      - name: Smoke test the staged archive
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          STAGE="$PWD/dist/dream-${TAG#v}-${{ matrix.target }}"
          mv "${HOME}/.dream/toolchains" "${HOME}/.dream/toolchains.off"
          trap 'mv "${HOME}/.dream/toolchains.off" "${HOME}/.dream/toolchains"' EXIT
          cd "$(mktemp -d)"
          env -u DREAM_LLVM python3 "${GITHUB_WORKSPACE}/scripts/test-release.py" --dream "$STAGE/dream"

      - name: Smoke test the staged Windows archive
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tag = '${{ github.event.inputs.tag || github.ref_name }}'
          $stage = (Resolve-Path "dist/dream-$($tag.TrimStart('v'))-${{ matrix.target }}").Path
          $toolchains = [IO.Path]::GetFullPath((Join-Path $env:USERPROFILE '.dream/toolchains'))
          $hidden = "$toolchains.off"
          if (Test-Path -LiteralPath $hidden) { throw "Toolchain backup already exists: $hidden" }
          Move-Item -LiteralPath $toolchains -Destination $hidden
          try {
            Remove-Item Env:DREAM_LLVM -ErrorAction SilentlyContinue
            $env:DREAM_NO_AUTO_INSTALL = '1'
            python -X utf8 scripts/test-release.py --dream "$stage/dream.exe"
            if ($LASTEXITCODE -ne 0) { throw 'Packaged compiler smoke tests failed' }
          } finally {
            Move-Item -LiteralPath $hidden -Destination $toolchains
          }

      - uses: actions/upload-artifact@v4
        with:
          name: dream-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  vscode:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and package VS Code extension
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          cd tooling/vscode
          npm ci
          npm run compile
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            npx @vscode/vsce package "$VERSION" --no-git-tag-version
          else
            npx @vscode/vsce package --no-git-tag-version
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vscode-extension
          path: tooling/vscode/*.vsix

  publish:
    needs: [build, vscode]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' -o -name '*.vsix' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Dream ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
