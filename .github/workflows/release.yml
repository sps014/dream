name: Release toolchain

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); leave empty to use github.ref_name"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Debian 12 (glibc 2.36 + WebKitGTK 4.1) so Linux `dream` runs hello-world and
          # `system.webview` on Debian 12 / Ubuntu 24.04+ without needing glibc 2.39.
          - os: ubuntu-latest
            container: debian:bookworm
            target: linux-x64
            rust_target: ""
            archive: tar.gz
          - os: ubuntu-24.04-arm
            container: debian:bookworm
            target: linux-arm64
            rust_target: ""
            archive: tar.gz
          # Intel macOS: cross-compile from Apple Silicon. macos-13 runners often sit
          # queued indefinitely on free/public repos.
          - os: macos-latest
            target: macos-x64
            rust_target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-latest
            target: macos-arm64
            rust_target: ""
            archive: tar.gz
          - os: windows-latest
            target: windows-x64
            rust_target: ""
            archive: zip

    runs-on: ${{ matrix.os }}
    container: ${{ contains(matrix.target, 'linux') && 'debian:bookworm' || fromJSON('null') }}
    steps:
      - name: Install Linux native build deps
        if: runner.os == 'Linux'
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git build-essential pkg-config \
            cmake ninja-build python3 clang libclang-dev \
            libssl-dev libwebkit2gtk-4.1-dev libgtk-3-dev libudev-dev

      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build release binaries
        shell: bash
        run: |
          set -euo pipefail
          TARGET_FLAG=()
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            TARGET_FLAG=(--target "${{ matrix.rust_target }}")
          fi
          cargo build --release -p dream -p dreamer -p dream-lsp "${TARGET_FLAG[@]}"

      - name: Package archive
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          STAGE="dist/dream-${VERSION}-${{ matrix.target }}"
          mkdir -p "$STAGE"
          EXT=""
          if [[ "${{ matrix.target }}" == windows-* ]]; then
            EXT=".exe"
          fi
          if [[ -n "${{ matrix.rust_target }}" ]]; then
            BIN_DIR="target/${{ matrix.rust_target }}/release"
          else
            BIN_DIR="target/release"
          fi
          cp "${BIN_DIR}/dream${EXT}" "$STAGE/"
          cp "${BIN_DIR}/dreamer${EXT}" "$STAGE/"
          cp "${BIN_DIR}/dream-lsp${EXT}" "$STAGE/"
          LIBDREAM_COPIED=0
          for f in libdream.so libdream.dylib dream.dll dream.dll.lib dream.lib libdream.dll.a; do
            if [[ -f "${BIN_DIR}/$f" ]]; then
              cp "${BIN_DIR}/$f" "$STAGE/"
              LIBDREAM_COPIED=1
            fi
          done
          if [[ "$LIBDREAM_COPIED" -eq 0 ]]; then
            echo "error: libdream shared library missing under ${BIN_DIR}" >&2
            ls -la "${BIN_DIR}"
            exit 1
          fi
          mkdir -p "$STAGE/lib/runtime"
          cp -R crates/dream-mir/src/runtime/c "$STAGE/lib/runtime/"
          mkdir -p dist
          if [[ "${{ matrix.archive }}" == "zip" ]]; then
            # Windows runners have no `zip`; use PowerShell Compress-Archive.
            if command -v powershell.exe >/dev/null 2>&1; then
              powershell.exe -NoProfile -Command \
                "Compress-Archive -Path 'dist/dream-${VERSION}-${{ matrix.target }}' -DestinationPath 'dist/dream-${VERSION}-${{ matrix.target }}.zip' -Force"
            elif command -v pwsh >/dev/null 2>&1; then
              pwsh -NoProfile -Command \
                "Compress-Archive -Path 'dist/dream-${VERSION}-${{ matrix.target }}' -DestinationPath 'dist/dream-${VERSION}-${{ matrix.target }}.zip' -Force"
            else
              tar -C dist -a -cf "dist/dream-${VERSION}-${{ matrix.target }}.zip" "dream-${VERSION}-${{ matrix.target }}"
            fi
          else
            tar -C dist -czf "dist/dream-${VERSION}-${{ matrix.target }}.tar.gz" "dream-${VERSION}-${{ matrix.target }}"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: dream-${{ matrix.target }}
          path: |
            dist/*.tar.gz
            dist/*.zip

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect archives + checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release
          find artifacts -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: Dream ${{ github.event.inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
