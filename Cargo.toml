[package]
name = "dream"
version = "0.1.0"
authors = ["Shivendra Pratap Singh <shivendrapsingh014@gmail.com>"]
edition = "2018"

[lib]
name = "dream"
crate-type = ["rlib"]

# Dream runtime defaults (read by `build.rs` → `DREAM_DEFAULT_STACK_SIZE`).
# Override at run time with env `DREAM_STACK_SIZE` (e.g. `32M`, `32MiB`, `33554432`).
# Host Rust thread stack for the compiler/tests is separate: set `RUST_MIN_STACK` (or
# `.cargo/config.toml` `[env]`) when `cargo test` / deep mono overflows.
[package.metadata.dream]
stack-size = "16MiB"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Front-end crates
dream-text = { path = "crates/dream-text" }
dream-diagnostics = { path = "crates/dream-diagnostics" }
dream-syntax = { path = "crates/dream-syntax" }
dream-format = { path = "crates/dream-format" }
# IR-boundary middle/back-end crates
dream-types = { path = "crates/dream-types" }
dream-hir = { path = "crates/dream-hir" }
dream-abi = { path = "crates/dream-abi" }
dream-stdlib = { path = "crates/dream-stdlib" }
dream-sema = { path = "crates/dream-sema" }
dream-mir = { path = "crates/dream-mir" }
bumpalo = "3.20.3"
# Content keys and artifact hashes for the build cache.
blake3 = "1"
# Insertion-ordered map used for the codegen tables whose iteration order reaches emitted
# `.wat` output, so compilation is reproducible (std `HashMap` randomizes iteration per run).
indexmap = "2"
logos = "0.16.1"
# `dream.toml` (`[package]`, `[[generators]]`, `[native.<set>]`) for the compiler's own reads.
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# CLI parsing + auto-generated help for the `dream` binary (same crate `dreamer` uses).
clap = { version = "4", features = ["derive", "env"] }
naga = { version = "30", default-features = false, features = ["wgsl-in"] }
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"], optional = true }
wasm-opt = { version = "0.116", optional = true }
oxc_minifier = "0.146"
oxc_parser = "0.146"
oxc_allocator = "0.146"
oxc_codegen = "0.146"
oxc_span = "0.146"
oxc_semantic = "0.146"
flate2 = "1.1.9"
brotli = "8.0.4"

object = { version = "0.37", default-features = false, features = ["read"], optional = true }
wasmparser = { version = "0.252", optional = true }
dunce = { version = "1", optional = true }

[features]
default = ["native", "wasm-opt"]
# Native compiler execution/linking tools; runtime hosts are built separately.
native = ["dep:serde", "dep:serde_json", "dep:image", "dep:object", "dep:wasmparser", "dep:dunce"]
# `wasm-opt` pulls in Binaryen bindings for the CLI's `-O`/`--optimize` flag. Separate from `native`
# since it's a build-time optimization concern rather than a runtime-execution one, but excluded
# from the wasm32 analyzer build the same way.
wasm-opt = ["dep:wasm-opt"]

[dev-dependencies]
libloading = "0.8"
tempfile = "3"
pretty_assertions = "1.4.1"
rayon = "1"
# Parses the emitted `.wat` text back into a module in wasm-opt / e2e assertions.
wat = "1.252.0"
wasmparser = "0.252"
rcgen = "0.13"

[profile.dev]
debug = "line-tables-only"

[profile.test]
# `-O1` keeps the compiler-heavy e2e cases fast to *run* while cutting test *build* time
# roughly in half versus `-O3` (the big crates are compiled a second time as test harnesses).
opt-level = 1
debug-assertions = true
overflow-checks = true

[workspace]
default-members = [".", "crates/dream-host", "crates/dream-host-core", "crates/dream-host-unicode", "crates/dream-host-crypto", "crates/dream-host-process", "crates/dream-host-timezone", "crates/dream-host-net", "crates/dream-host-gpu", "crates/dream-host-webview"]
members = [
    ".",
    "crates/dream-text",
    "crates/dream-diagnostics",
    "crates/dream-syntax",
    "crates/dream-format",
    "crates/dream-types",
    "crates/dream-hir",
    "crates/dream-abi",
    "crates/dream-stdlib",
    "crates/dream-sema",
    "crates/dream-mir",
    "crates/dream-host",
    "crates/dream-host-core",
    "crates/dream-host-unicode",
    "crates/dream-host-crypto",
    "crates/dream-host-process",
    "crates/dream-host-timezone",
    "crates/dream-host-abi",
    "crates/dream-host-gui",
    "crates/dream-host-net",
    "crates/dream-host-gpu",
    "crates/dream-host-webview",
    "tooling/dream-lsp",
    "tooling/dreamer",
    "tooling/dream-runner",
]
# v2 resolver so the wasm32 analyzer build does not inherit the root crate's default
# wasm32 analyzer build does not inherit the root crate's default `native` feature.
resolver = "2"
