[package]
name = "dream"
version = "0.1.0"
authors = ["Shivendra Pratap Singh <shivendrapsingh014@gmail.com>"]
edition.workspace = true
autotests = false

[lib]
name = "dream"
crate-type = ["rlib"]

[[test]]
name = "integration"
path = "tests/integration.rs"

# Dream runtime defaults (read by `build.rs` → `DREAM_DEFAULT_STACK_SIZE`).
# Override at run time with env `DREAM_STACK_SIZE` (e.g. `32M`, `32MiB`, `33554432`).
# Host Rust thread stack for the compiler/tests is separate: set `RUST_MIN_STACK` (or
# `.cargo/config.toml` `[env]`) when `cargo test` / deep mono overflows.
[package.metadata.dream]
stack-size = "16MiB"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Front-end crates
dream-text = { path = "crates/dream-text" }
dream-diagnostics = { path = "crates/dream-diagnostics" }
dream-syntax = { path = "crates/dream-syntax" }
dream-format = { path = "crates/dream-format" }
# IR-boundary middle/back-end crates
dream-types = { path = "crates/dream-types" }
dream-hir = { path = "crates/dream-hir" }
dream-abi = { path = "crates/dream-abi" }
dream-stdlib = { path = "crates/dream-stdlib" }
dream-sema = { path = "crates/dream-sema" }
dream-mir = { path = "crates/dream-mir" }
bumpalo = "3.20.3"
# Content keys and artifact hashes for the build cache.
blake3 = "1"
depfile = { version = "0.1.1", optional = true }
rayon = { version = "1", optional = true }
# Insertion-ordered map used for the codegen tables whose iteration order reaches emitted
# `.wat` output, so compilation is reproducible (std `HashMap` randomizes iteration per run).
indexmap = "2"
logos = "0.16.1"
# `dream.toml` (`[package]`, `[[generators]]`, `[native.<set>]`) for the compiler's own reads.
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
# CLI parsing + auto-generated help for the `dream` binary (same crate `dreamer` uses).
clap = { version = "4", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["unbounded_depth"] }
serde_stacker = "0.1"
base64 = "0.22"
tempfile = { version = "3", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"], optional = true }
oxc_minifier = "0.146"
oxc_parser = "0.146"
oxc_ast = "0.146"
oxc_allocator = "0.146"
oxc_codegen = "0.146"
oxc_span = "0.146"
oxc_semantic = "0.146"
flate2 = "1.1.9"
brotli = "8.0.4"

object = { version = "0.37", default-features = false, features = ["read"], optional = true }
wasmparser = "0.252"
# Canonical paths without Windows' `\\?\` verbatim prefix, which clang cannot resolve includes under.
dunce = "1"
which = "8.0.6"

[features]
default = ["native"]
# Native compiler execution/linking tools; runtime hosts are built separately.
native = ["dep:tempfile", "dep:rayon", "dep:depfile", "dep:image", "dep:object", "dep:libc", "dep:windows-sys"]
[target.'cfg(unix)'.dependencies]
libc = { version = "0.2", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Threading"], optional = true }

[dev-dependencies]
rcgen = "0.14"
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", features = ["sink"] }
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
tempfile = "3"
proptest = "1"
libloading = "0.8"
pretty_assertions = "1.4.1"
# Parses the emitted `.wat` text back into a module in wasm-opt / e2e assertions.
wat = "1.252.0"
wasmparser = "0.252"

[profile.dev]
debug = "line-tables-only"

# Cache validation hashes LLVM tools and transitive headers on every cache lookup.
[profile.dev.package.blake3]
opt-level = 3

# At opt-level 0 the cmake crate builds GLFW as a CMake `Debug` config, which links the debug
# MSVC CRT (`MSVCRTD`) while Rust links the release CRT, and `link.exe` warns (LNK4098).
[profile.dev.package.glfw-sys]
opt-level = 1

[profile.test]
# `-O1` keeps the compiler-heavy e2e cases fast to *run* while cutting test *build* time
# roughly in half versus `-O3` (the big crates are compiled a second time as test harnesses).
opt-level = 1
debug-assertions = true
overflow-checks = true

[workspace.package]
edition = "2024"

[workspace]
default-members = [".", "crates/dream-host", "crates/dream-host-core", "crates/dream-host-crypto", "crates/dream-host-process", "crates/dream-host-timezone", "crates/dream-host-net",
    "crates/dream-host-io", "crates/dream-host-window", "crates/dream-host-gpu", "crates/dream-host-audio"]
members = [
    ".",
    "crates/dream-text",
    "crates/dream-diagnostics",
    "crates/dream-syntax",
    "crates/dream-format",
    "crates/dream-types",
    "crates/dream-hir",
    "crates/dream-abi",
    "crates/dream-stdlib",
    "crates/dream-sema",
    "crates/dream-mir",
    "crates/dream-host",
    "crates/dream-host-core",
    "crates/dream-host-crypto",
    "crates/dream-host-process",
    "crates/dream-host-timezone",
    "crates/dream-host-net",
    "crates/dream-host-io",
    "crates/dream-host-window",
    "crates/dream-host-gpu",
    "crates/dream-host-audio",
    "crates/dream-drawing",
    "crates/dream-host-drawing",
    "crates/dream-host-abi",
    "tooling/dream-lsp",
    "tooling/dreamer",
    "tooling/dream-runner",
]
# Resolver 2+ feature unification, so the wasm32 analyzer build does not inherit the root
# crate's default `native` feature.
resolver = "3"

