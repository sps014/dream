[package]
name = "dream-drawing"
version = "0.1.0"
edition.workspace = true

[lib]
crate-type = ["rlib", "cdylib"]

[dependencies]
vello_cpu = "=0.3.0"
vello_gpu = "=0.3.0"
vello_common = "=0.3.0"
wgpu = "30"
thiserror = "2"
futures-channel = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
parley = { version = "=0.12.0", default-features = false, features = ["std", "complex-scripts"] }
glifo = "=0.4.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "0.4"
vello_cpu = { version = "=0.3.0", features = ["multithreading"] }
parley = { version = "=0.12.0", features = ["system"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[dev-dependencies]
serde_json = "1"
