[package]
name = "dream-host-abi"
version = "0.1.0"
edition.workspace = true

[features]
operations = ["dep:tokio", "dep:serde_json"]

[dependencies]
dream-abi = { path = "../dream-abi" }
tokio = { version = "1", features = ["rt", "sync"], optional = true }
serde_json = { version = "1", optional = true }
