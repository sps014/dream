[package]
name = "dream-host-cli"
version = "0.1.0"
edition.workspace = true

[lib]
name = "dream_host_cli"
crate-type = ["cdylib"]

[dependencies]
clap = { version = "4", features = ["string", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
