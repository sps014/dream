[package]
name = "dream-host-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "dream_host_crypto"
crate-type = ["cdylib"]

[dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
getrandom = "0.4"
aes-gcm = "0.11"

argon2 = "0.6"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
serde_json = "1"
