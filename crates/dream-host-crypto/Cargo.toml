[package]
name = "dream-host-crypto"
version = "0.1.0"
edition.workspace = true

[lib]
name = "dream_host_crypto"
crate-type = ["cdylib"]

[dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
getrandom = "0.2"
aes-gcm = "0.10"

argon2 = "0.5"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
serde_json = "1"
