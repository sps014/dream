[package]
name = "dream-host-data"
version = "0.1.0"
edition.workspace = true

[lib]
name = "dream_host_data"
crate-type = ["cdylib"]

[dependencies]
csv = "1"
hex = "0.4"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
