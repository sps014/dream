[package]
name = "dream-host-data"
version = "0.1.0"
edition.workspace = true

[lib]
name = "dream_host_data"
crate-type = ["cdylib"]

[dependencies]
dream-abi = { path = "../dream-abi" }
csv = { version = "1", optional = true }
hex = { version = "0.4", optional = true }
flate2 = { version = "1", default-features = false, features = ["zlib-rs"], optional = true }
serde_json = "1"

[features]
default = ["csv", "compression"]
csv = ["dep:csv"]
compression = ["dep:flate2", "dep:hex"]

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
