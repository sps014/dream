[package]
name = "dream-host-drawing"
version = "0.1.0"
edition.workspace = true

[lib]
name = "dream_host_drawing"
crate-type = ["cdylib", "rlib"]

[dependencies]
dream-drawing = { path = "../dream-drawing" }
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
pollster = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
dream-host-gpu = { path = "../dream-host-gpu" }
