[package]
name = "dream-host-drawing"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "dream_host_drawing"
crate-type = ["cdylib", "rlib"]

[dependencies]
dream-drawing = { path = "../dream-drawing" }
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
pollster = "0.4"

# `dream-host-core` is a link-time dependency: this cdylib calls core's C ABI through the shared
# library, so no Rust item is imported and a Rust import would duplicate core's state.
[lints.cargo]
unused_dependencies = "allow"
