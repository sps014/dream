[package]
name = "dream-host-gpu"
version = "0.1.0"
edition = "2021"

[lib]
name = "dream_host_gpu"
crate-type = ["cdylib"]

[dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
dream-abi = { path = "../dream-abi" }
indexmap = "2"
wgpu = { version = "24" }
pollster = { version = "0.4" }
winit = { version = "0.30" }
gilrs = { version = "0.11" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1" }
dream-host-gui = { path = "../dream-host-gui" }
