[package]
name = "dream-host-gpu"
version = "0.1.0"
edition.workspace = true

[lib]
name = "dream_host_gpu"
# The rlib lets the backend harness test drive the host without a guest.
crate-type = ["cdylib", "rlib"]

[[test]]
name = "backends"
path = "tests/backends.rs"
# Each backend runs in a child process (its own loader state and Vulkan environment), and
# window surfaces need the process main thread, which libtest does not offer.
harness = false

[dependencies]
dream-abi = { path = "../dream-abi" }
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
sha2 = "0.10"
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[dev-dependencies]
proptest = "1"
dream-host-window = { path = "../dream-host-window" }

[build-dependencies]
cmake = "0.1"
sha2 = "0.10"
toml = "0.8"
ureq = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
