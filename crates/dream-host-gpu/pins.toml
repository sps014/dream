# Pinned inputs of the dream-host-gpu build (build.rs) and of the Milestone 0 probe. `sha256` is
# what the upstream release publishes and what every download is verified against; `blake3` is
# what Dream's tool registry records. `python3 aot_probe/build.py pin` re-derives every BLAKE3
# from a fresh download. The host build reads only `include/` from the Slang archive: the
# compiler library is never linked or loaded by the host.

[slang]
version = "2026.20"
release = "https://github.com/shader-slang/slang/releases/tag/v2026.20"
# The executable the generator runs (`.exe` on Windows); Dream pins tools by its file hash.
tool = "bin/slangc"
# BLAKE3 of bin/slangc from the macos-aarch64 archive (the form src/driver/generate/tools.rs pins).
tool_blake3.macos-aarch64 = "7bfad33143541ca4c9c69ebdeb51cc1f53eef2bbab9f3e635e987b657867c6de"

