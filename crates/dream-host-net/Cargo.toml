[package]
name = "dream-host-net"
version = "0.1.0"
edition.workspace = true

[lib]
name = "dream_host_net"
crate-type = ["cdylib"]

[dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
bytes = "1"
base64 = "0.22"
tokio-rustls = "0.26"
rustls-pemfile = "2"
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "handshake", "rustls-tls-webpki-roots"] }
multer = "3"
futures-util = { version = "0.3", features = ["sink"] }
tokio-stream = "0.1"

openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }

[dev-dependencies]
tempfile = "3"
rcgen = "0.14"
rustls = "0.23"
jsonwebtoken = { version = "10", features = ["rust_crypto"] }
rsa = "0.9"
rand = "0.8"
sha2 = "0.10"
