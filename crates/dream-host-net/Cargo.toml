[package]
name = "dream-host-net"
version = "0.1.0"
edition.workspace = true

[lib]
name = "dream_host_net"
crate-type = ["cdylib"]

[dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
url = "2.5"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"

[dev-dependencies]
rcgen = "0.14"
rustls = "0.23"
