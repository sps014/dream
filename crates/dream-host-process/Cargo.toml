[package]
name = "dream-host-process"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "dream_host_process"
crate-type = ["cdylib"]

[dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi", features = ["operations"] }
indexmap = "2"

tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "process", "io-util"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# `dream-host-core` is a link-time dependency: this cdylib calls core's C ABI through the shared
# library, so no Rust item is imported and a Rust import would duplicate core's state.
[lints.cargo]
unused_dependencies = "allow"
