[package]
name = "dream-host-window"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
name = "dream_host_window"
# The rlib lets the main-thread harness test drive the host without a guest.
crate-type = ["cdylib", "rlib"]

[[test]]
name = "main_thread"
path = "tests/main_thread.rs"
# SDL video must run on the process main thread; libtest uses worker threads.
harness = false

[[test]]
name = "app_loop"
path = "tests/app_loop.rs"
# The platform loop runs SDL's main callbacks on the main thread and quits SDL when it ends.
harness = false

[dependencies]
dream-host-core = { path = "../dream-host-core" }
dream-host-abi = { path = "../dream-host-abi" }
# Cargo.lock pins the bindings and vendored SDL sources; CMake fetches no binaries.
sdl3 = { version = "=0.22.0", default-features = false, features = ["build-from-source-static"] }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "ios")'.dependencies]
libc = "0.2"
