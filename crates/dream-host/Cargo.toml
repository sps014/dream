[package]
name = "dream-host"
version = "0.1.0"
edition.workspace = true

[dependencies]
dream-host-core = { path = "../dream-host-core", optional = true }

dream-host-crypto = { path = "../dream-host-crypto", optional = true }
dream-host-process = { path = "../dream-host-process", optional = true }
dream-host-timezone = { path = "../dream-host-timezone", optional = true }

dream-host-net = { path = "../dream-host-net", optional = true }


dream-host-io = { path = "../dream-host-io", optional = true }

dream-host-window = { path = "../dream-host-window", optional = true }

dream-host-gpu = { path = "../dream-host-gpu", optional = true }

dream-host-audio = { path = "../dream-host-audio", optional = true }
dream-host-drawing = { path = "../dream-host-drawing", optional = true }

[features]
default = ["core", "crypto", "process", "timezone", "net", "io", "window", "gpu", "audio", "drawing"]
core = ["dep:dream-host-core"]
crypto = ["core", "dep:dream-host-crypto"]
process = ["core", "dep:dream-host-process"]
timezone = ["core", "dep:dream-host-timezone"]
net = ["core", "dep:dream-host-net"]
io = ["core", "dep:dream-host-io"]
window = ["core", "dep:dream-host-window"]
gpu = ["core", "dep:dream-host-gpu"]

audio = ["core", "dep:dream-host-audio"]
drawing = ["core", "dep:dream-host-drawing"]
