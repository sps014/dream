[package]
name = "dream-rt"
version = "0.1.0"
edition = "2018"

[lib]
name = "dream_rt"
path = "src/lib.rs"
crate-type = ["rlib", "staticlib"]

[features]
default = []
http = ["dep:reqwest"]
net = ["dep:tungstenite"]
gpu = ["dep:wgpu", "dep:pollster", "dep:winit", "dep:gilrs", "dep:image"]
webview = ["dep:wry", "dep:winit"]
full = ["http", "net", "gpu", "webview"]

[dependencies]
dream-mir = { path = "../dream-mir" }
indexmap = "2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.2"
aes-gcm = "0.10"
unicode-normalization = "0.1"
unicode-segmentation = "1.12"
chrono = "0.4"
chrono-tz = "0.10"
iana-time-zone = "0.1"
reqwest = { version = "0.12", features = ["blocking", "json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tungstenite = { version = "0.24", optional = true, default-features = false, features = ["handshake", "native-tls"] }
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
winit = { version = "0.30", optional = true }
gilrs = { version = "0.11", optional = true }
image = { version = "0.25", optional = true, default-features = false, features = ["png"] }
wry = { version = "0.53", optional = true }
libloading = "0.8"
libffi = { version = "3.2", features = ["system"] }

[build-dependencies]
cc = "1.2"
