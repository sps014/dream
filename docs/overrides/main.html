{% extends "base.html" %}

{% block content %}
  {{ super() }}
  {% if dream_related %}
    <aside class="dream-related" aria-label="Related guides">
      <h2 class="dream-related__title">Related</h2>
      <ul class="dream-index">
        {% for entry in dream_related %}
          <li class="dream-index__item">
            <a class="dream-index__link" href="{{ entry.url }}">
              <span class="dream-index__title">{{ entry.title }}</span>
              {% if entry.summary %}
                <span class="dream-index__summary">{{ entry.summary }}</span>
              {% endif %}
            </a>
          </li>
        {% endfor %}
      </ul>
    </aside>
  {% endif %}
{% endblock %}
