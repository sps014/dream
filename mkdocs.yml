site_name: Dream
site_description: A statically typed language that compiles to native binaries and WebAssembly.
site_url: https://sps014.github.io/dream/
repo_url: https://github.com/sps014/dream
repo_name: sps014/dream

theme:
  name: material
  custom_dir: docs/overrides
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/star-four-points
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - content.action.edit
    - content.action.view
    - content.code.annotate
    - content.code.copy
    - content.code.select
    - content.tooltips
    - navigation.footer
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.path
    - navigation.prune
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - stylesheets/tokens.css
  - stylesheets/layout.css
  - stylesheets/components.css
  - stylesheets/home.css

extra_javascript:
  - javascripts/shortcuts.js
  - javascripts/card-filter.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/sps014/dream

plugins:
  - search
  - awesome-nav

hooks:
  - tooling/docs/dream_lexer.py
  - tooling/docs/site_hook.py

exclude_docs: |
  _template.md
  overrides/

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      dedent_subsections: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

validation:
  links:
    not_found: warn
    anchors: warn
    unrecognized_links: warn
