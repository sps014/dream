<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dream Ocean</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #1a3048; }
      canvas#ocean {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #6aa0d8;
      }
      #hud {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        z-index: 2;
        color: #e8eef6;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 0.85rem;
        opacity: 0.8;
        pointer-events: none;
        text-shadow: 0 1px 4px #000;
      }
      #hud.err { color: #ff8a8a; opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="ocean" width="960" height="540"></canvas>
    <div id="hud">loading…</div>
    <script type="module">
      // Prefer the per-module runtime emitted next to the .wasm (`--runtime --web`).
      let run;
      try {
        ({ run } = await import("./target/debug/ocean.web.runtime.js"));
      } catch (_) {
        ({ run } = await import("../../../runtime/dream.js"));
      }

      const hud = document.getElementById("hud");
      const setHud = (msg, err = false) => {
        hud.textContent = msg;
        hud.classList.toggle("err", err);
      };

      window.addEventListener("unhandledrejection", (e) => {
        setHud(String(e.reason || e), true);
      });

      try {
        await run("./target/debug/ocean.wasm");
        setHud("gerstner ocean · webgpu");
      } catch (e) {
        console.error(e);
        setHud(String(e && e.message ? e.message : e), true);
      }
    </script>
  </body>
</html>
