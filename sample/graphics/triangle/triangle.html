<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dream Triangle</title>
    <style>
      html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #0a0a0f; }
      canvas#c {
        display: block;
        width: 100vw;
        height: 100vh;
        background: #0a0a0f;
      }
      #hud {
        position: fixed;
        left: 1rem;
        bottom: 1rem;
        color: #ddd;
        font-family: "IBM Plex Sans", system-ui, sans-serif;
        font-size: 0.85rem;
        opacity: 0.8;
        pointer-events: none;
      }
      #hud.err { color: #ff8a8a; opacity: 1; }
    </style>
  </head>
  <body>
    <canvas id="c" width="800" height="600"></canvas>
    <div id="hud">loading…</div>
    <script type="module">
      // Prefer the per-module runtime emitted next to the .wasm (`--runtime --web`).
      // Fall back to the full repo runtime when serving from the repository root.
      let run;
      try {
        ({ run } = await import("./target/debug/triangle.web.runtime.js"));
      } catch (_) {
        ({ run } = await import("../../../runtime/dream.js"));
      }
      const hud = document.getElementById("hud");
      const setHud = (msg, err = false) => {
        hud.textContent = msg;
        hud.classList.toggle("err", err);
      };
      try {
        await run("./target/debug/triangle.wasm", { canvas: "c" });
        setHud("triangle");
      } catch (e) {
        console.error(e);
        setHud(String(e && e.message ? e.message : e), true);
      }
    </script>
  </body>
</html>
