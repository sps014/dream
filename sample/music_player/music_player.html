<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dream Music Player</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c5cff'/%3E%3Cstop offset='1' stop-color='%23ff6bd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='100' height='100' rx='24' fill='url(%23g)'/%3E%3Ctext x='50' y='68' font-size='52' text-anchor='middle'%3E%E2%99%AB%3C/text%3E%3C/svg%3E" />
    <style>
      :root {
        --bg: #0b0b12;
        --card: rgba(22, 22, 32, 0.55);
        --card-border: rgba(255, 255, 255, 0.12);
        --accent: #7c5cff;
        --accent-2: #ff6bd6;
        --accent-soft: #7c5cff33;
        --text: #f3f1fb;
        --muted: #9793ad;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        background: var(--bg);
        color: var(--text);
        height: 100vh;
        margin: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1rem;
        overflow: hidden;
        position: relative;
      }

      /* Drifting gradient orbs behind the glass — the backdrop the card blurs. */
      .orb {
        position: fixed;
        border-radius: 50%;
        filter: blur(90px);
        opacity: 0.55;
        pointer-events: none;
        animation: drift 26s ease-in-out infinite alternate;
      }

      .orb.a {
        width: 46vmax;
        height: 46vmax;
        left: -14vmax;
        top: -18vmax;
        background: radial-gradient(circle at 35% 35%, #6a48ff, transparent 65%);
      }

      .orb.b {
        width: 40vmax;
        height: 40vmax;
        right: -12vmax;
        bottom: -16vmax;
        background: radial-gradient(circle at 60% 60%, #ff4fc3, transparent 65%);
        animation-delay: -13s;
        animation-direction: alternate-reverse;
      }

      @keyframes drift {
        from { transform: translate3d(0, 0, 0) scale(1); }
        to { transform: translate3d(9vmax, 6vmax, 0) scale(1.18); }
      }

      @media (prefers-reduced-motion: reduce) {
        .orb { animation: none; }
      }

      .player {
        position: relative;
        width: 100%;
        max-width: 460px;
        max-height: 100%;
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 24px;
        padding: 1.2rem 1.35rem;
        box-shadow:
          0 30px 70px -25px rgba(0, 0, 0, 0.8),
          inset 0 1px 0 rgba(255, 255, 255, 0.14);
        backdrop-filter: blur(28px) saturate(160%);
        -webkit-backdrop-filter: blur(28px) saturate(160%);
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* Top edge light catch — the classic glass highlight. */
      .player::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.45),
          transparent
        );
        pointer-events: none;
      }

      .header-row {
        display: flex;
        align-items: center;
        gap: 0.85rem;
        margin-bottom: 0.9rem;
      }

      .art {
        width: 3.3rem;
        height: 3.3rem;
        flex-shrink: 0;
        border-radius: 14px;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.5rem;
        box-shadow:
          0 12px 26px -12px var(--accent-soft),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .now-playing {
        min-width: 0;
        flex: 1;
      }

      .eyebrow {
        font-size: 0.65rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.15rem;
      }

      #track-title {
        display: block;
        font-size: 1.05rem;
        font-weight: 700;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #track-artist {
        display: block;
        font-size: 0.8rem;
        color: var(--muted);
        margin-top: 0.1rem;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .seek-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.65rem;
      }

      input[type="range"] {
        -webkit-appearance: none;
        appearance: none;
        flex: 1;
        height: 5px;
        border-radius: 3px;
        /* Filled portion painted by the `--fill` custom property (set from Dream). */
        background: linear-gradient(
          to right,
          var(--accent) 0%,
          var(--accent-2) var(--fill, 0%),
          #2f2f40 var(--fill, 0%)
        );
        outline: none;
      }

      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        appearance: none;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
        box-shadow: 0 0 0 4px var(--accent-soft);
      }

      input[type="range"]::-moz-range-thumb {
        width: 13px;
        height: 13px;
        border: none;
        border-radius: 50%;
        background: #fff;
        cursor: pointer;
      }

      #time-display {
        font-size: 0.7rem;
        color: var(--muted);
        min-width: 4.5rem;
        text-align: right;
        font-variant-numeric: tabular-nums;
      }

      .transport {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        margin-bottom: 0.75rem;
      }

      .transport button {
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.06);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        color: var(--text);
        font-size: 1.25rem;
        cursor: pointer;
        padding: 0.4rem;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        transition:
          background 0.15s ease,
          transform 0.1s ease,
          border-color 0.15s ease,
          box-shadow 0.2s ease;
      }

      .transport button:hover {
        background: rgba(255, 255, 255, 0.12);
        border-color: rgba(255, 255, 255, 0.22);
      }

      .transport button:active {
        transform: scale(0.92);
      }

      #play-button {
        width: 3.1rem;
        height: 3.1rem;
        font-size: 1.3rem;
        border: none;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        box-shadow:
          0 10px 26px -8px var(--accent-soft),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      #play-button:hover {
        filter: brightness(1.12);
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        box-shadow:
          0 14px 34px -8px var(--accent-soft),
          inset 0 1px 0 rgba(255, 255, 255, 0.35);
      }

      .status {
        min-height: 1.1rem;
        margin: 0 0 0.55rem;
        font-size: 0.72rem;
        color: var(--muted);
        text-align: center;
        opacity: 0;
        transition: opacity 0.25s ease;
      }

      .status.show {
        opacity: 1;
        color: #ffb86b;
      }

      .volume-row {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        margin-bottom: 0.75rem;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .volume-row input[type="range"] {
        max-width: 140px;
      }

      .playlist-heading {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        font-size: 0.65rem;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        color: var(--muted);
        margin: 0 0 0.4rem;
        flex-shrink: 0;
      }

      .playlist-heading span.count {
        text-transform: none;
        letter-spacing: normal;
        font-size: 0.72rem;
      }

      #playlist {
        list-style: none;
        margin: 0;
        padding: 0;
        flex: 1;
        min-height: 60px;
        max-height: 230px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 0.15rem;
      }

      #playlist::-webkit-scrollbar {
        width: 6px;
      }

      #playlist::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.12);
        border-radius: 3px;
      }

      #playlist .track {
        display: flex;
        align-items: center;
        gap: 0.6rem;
        padding: 0.45rem 0.6rem;
        border-radius: 10px;
        cursor: pointer;
        border: 1px solid transparent;
        transition: background 0.15s ease, border-color 0.15s ease;
      }

      #playlist .track:hover {
        background: rgba(255, 255, 255, 0.05);
      }

      #playlist .track.active {
        background: var(--accent-soft);
        border-color: rgba(124, 92, 255, 0.4);
        box-shadow: inset 3px 0 0 -1px var(--accent);
      }

      #playlist .track.unavailable {
        opacity: 0.42;
      }

      #playlist .track.unavailable .track-title {
        text-decoration: line-through;
      }

      .track-info {
        display: flex;
        flex-direction: column;
        min-width: 0;
        flex: 1;
      }

      .track-title-row {
        display: flex;
        align-items: center;
        gap: 0.4rem;
        min-width: 0;
      }

      #playlist .track-title {
        font-size: 0.85rem;
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      #playlist .track-artist {
        font-size: 0.72rem;
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .ncs-badge {
        flex-shrink: 0;
        font-size: 0.58rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #0b0b12;
        background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
        padding: 0.08rem 0.4rem;
        border-radius: 999px;
      }

      .footnote {
        text-align: center;
        font-size: 0.63rem;
        color: var(--muted);
        margin-top: 0.6rem;
        flex-shrink: 0;
      }

      .footnote code {
        color: var(--text);
      }
    </style>
  </head>
  <body>
    <div class="orb a"></div>
    <div class="orb b"></div>
    <main class="player">
      <div class="header-row">
        <div class="art">&#127925;</div>
        <div class="now-playing">
          <p class="eyebrow">Dream &middot; compiled to WebAssembly</p>
          <span id="track-title">Loading&hellip;</span>
          <span id="track-artist"></span>
        </div>
      </div>

      <div class="seek-row">
        <input id="seek" type="range" min="0" max="100" value="0" step="0.1" />
        <span id="time-display">0:00 / 0:00</span>
      </div>

      <div class="transport">
        <button id="prev-button" aria-label="Previous">&#9198;</button>
        <button id="play-button" aria-label="Play">&#9654;</button>
        <button id="next-button" aria-label="Next">&#9197;</button>
      </div>

      <div class="volume-row">
        <span>&#128266;</span>
        <input id="volume" type="range" min="0" max="100" value="80" />
      </div>

      <p class="status" id="player-status"></p>

      <p class="playlist-heading">
        <span>Playlist</span>
        <span class="count">NCS &middot; SoundHelix</span>
      </p>
      <ul id="playlist"></ul>

      <!-- Dream drives this element entirely via the dynamic `js` type: no inline JS here. -->
      <audio id="audio-player" preload="metadata"></audio>

      <p class="footnote">
        Logic lives in <code>music_player.dream</code>, compiled to WebAssembly.
      </p>
    </main>

    <script type="module">
      let run;
      try {
        ({ run } = await import("./target/web/music_player.web.runtime.js"));
      } catch (_) {
        ({ run } = await import("../../runtime/dream.js"));
      }
      await run("target/web/music_player.wasm");
    </script>
  </body>
</html>
