[package]
name = "dream-micro-rust"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "dream-micro-rust"
path = "src/main.rs"

[[bin]]
name = "dream-macro-rust"
path = "src/macro_main.rs"

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
futures-util = "0.3"
rayon = "1"
