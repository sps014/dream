[package]
name = "dream-lsp"
version = "0.1.0"
authors = ["Shivendra Pratap Singh <shivendrapsingh014@gmail.com>"]
edition.workspace = true
description = "Native VS Code Language Server for the Dream language."
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
dream = { path = "../..", default-features = false }
dream-format = { path = "../../crates/dream-format" }
dream-sema = { path = "../../crates/dream-sema" }
dream-stdlib = { path = "../../crates/dream-stdlib" }
dream-abi = { path = "../../crates/dream-abi" }
dream-hir = { path = "../../crates/dream-hir" }
dream-types = { path = "../../crates/dream-types" }
indexmap = "2"
bumpalo = "3.20.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-lsp = "0.20"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "time"] }
dashmap = "5.5"
