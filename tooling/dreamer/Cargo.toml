[package]
name = "dreamer"
version = "0.1.0"
authors = ["Shivendra Pratap Singh <shivendrapsingh014@gmail.com>"]
edition.workspace = true
license.workspace = true
description = "Package manager for the Dream language: dream.toml manifests, dream.lock lockfiles, and dream_packages/ dependency installs."

[lib]
name = "dreamer"
path = "src/lib.rs"

[[bin]]
name = "dreamer"
path = "src/main.rs"

[dependencies]
dream-abi = { path = "../../crates/dream-abi" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"
semver = { version = "1", features = ["serde"] }
sha2 = "0.11"
flate2 = "1"
tar = "0.4"
lzma-rs = "0.3"
zip = { version = "9", default-features = false, features = ["deflate"] }
ureq = { version = "3", features = ["json"] }
base64 = "0.23"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
dirs = "7"
tiny_http = "0.12"
yansi = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
tempfile = "3"
# Locates the host C++ compiler that builds dream-slang-layout during `toolchain install slang`.
cc = "1"
which = "8.0.6"
dunce = "1"

[build-dependencies]
# Same pinned SDL sources as dream-host-window; supplies the APK's Java activity layer.
sdl3-src = "=3.4.20"

[dev-dependencies]
object = { version = "0.39", default-features = false, features = ["read"] }

[target.'cfg(windows)'.dependencies]
junction = "2.1"
